services:
  db:
    # Pinned to a MariaDB LTS release. WordPress is happy on MariaDB and it is
    # noticeably lighter than MySQL for a classroom machine.
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: "${WORDPRESS_DB_NAME:-wordpress}"
      MARIADB_USER: "${WORDPRESS_DB_USER:-wordpress}"
      MARIADB_PASSWORD: "${WORDPRESS_DB_PASSWORD:-wordpress}"
      MARIADB_ROOT_PASSWORD: "${WORDPRESS_DB_ROOT_PASSWORD:-root}"
    volumes:
      # Named volume, so the database survives "down" but is not littered
      # across the project directory (and never lands in git).
      - dbdata:/var/lib/mysql
    healthcheck:
      # WordPress crashes on boot if it reaches a database that is still
      # starting, so the app waits for this to pass rather than for the
      # container merely to exist.
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    # Not published to the host: only the app container needs the database.
    # Add a "ports:" entry here if you want to attach a GUI client.
    expose:
      - "3306"

  wordpress:
    image: wordpress:6.8-php8.3-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Host port is overridable: HTTP_PORT=9000 ./start.sh
      # 8080 keeps out of the way of WEBT_Symfony (80) and WEBT_PHP (8714).
      - "${HTTP_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: "db:3306"
      WORDPRESS_DB_NAME: "${WORDPRESS_DB_NAME:-wordpress}"
      WORDPRESS_DB_USER: "${WORDPRESS_DB_USER:-wordpress}"
      WORDPRESS_DB_PASSWORD: "${WORDPRESS_DB_PASSWORD:-wordpress}"
      # Development settings. WP_DEBUG surfaces PHP notices in the page instead
      # of hiding them, which is what you want while teaching.
      WORDPRESS_DEBUG: "${WORDPRESS_DEBUG:-1}"
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', true);
    volumes:
      # Live editing: themes and plugins written here appear on the host, so
      # students edit them with a normal editor and reload the browser.
      # WordPress core itself stays inside the container.
      - ./wp-content:/var/www/html/wp-content
      - ./uploads.ini:/usr/local/etc/php/conf.d/uploads.ini

volumes:
  dbdata:
